# 每週彙整成「一個」PR，避免每個套件各開一張造成通知轟炸。
# 資安性更新（security updates）不受 schedule 限制，仍會在弱點公告時即時開 PR。
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      python-deps:
        patterns: ["*"]
    ignore:
      # drf-yasg 仍依賴 pkg_resources，見 requirements.txt 註解。
      - dependency-name: setuptools
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
