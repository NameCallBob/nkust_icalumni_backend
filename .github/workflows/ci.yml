name: CI

# 純檢查用 CI：語法檢查、Django check、migration 檢查、測試、覆蓋率、相依弱點掃描。
# 不會部署任何東西——部署仍由人工執行。
#
# 全部測試皆為離線執行（SQLite in-memory、locmem 郵件、封鎖對外連線），
# 因此這裡不需要 MySQL/Redis service container，也不會碰到任何真實資料或寄出郵件。

on:
  pull_request:
  push:
    branches: [main, develop, safe-backup-branch]
  workflow_dispatch:

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  # 純 CI 用假值，不對應任何真實環境。
  SECRET_KEY: ci-dummy-secret-key-not-for-production
  DJANGO_SETTINGS_MODULE: tests.settings_test
  ENABLE_DEV_ORIGINS: '1'

jobs:
  test:
    name: Lint, Checks & Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 正式環境跑 3.12；一併跑 3.13 以便及早發現相依套件的相容問題。
        python-version: ['3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps for mysqlclient
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config build-essential

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # 只抓真的會炸的問題（語法錯誤、未定義變數），不含風格檢查，
      # 避免既有程式碼的風格問題把 CI 直接卡死。
      - name: Syntax / undefined-name check
        run: flake8 . --select=E9,F63,F7,F82 --exclude=venv-alumni,migrations,static,static_files,system_needed,node_modules

      - name: Django system check
        run: python manage.py check

      - name: Detect missing migrations
        run: python manage.py makemigrations --check --dry-run

      # 覆蓋率門檻定義在 .coveragerc 的 fail_under；低於門檻此步驟會失敗。
      - name: Run test suite with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml --junitxml=reports/junit.xml

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports-py${{ matrix.python-version }}
          path: |
            reports/
            coverage.xml
          retention-days: 14
          if-no-files-found: ignore

  security-scan:
    name: Dependency & Static Security Scan
    runs-on: ubuntu-latest
    # 掃描結果不阻擋合併（既有相依套件的 CVE 需要另行排程處理），
    # 但報告會上傳為 artifact，並在 job summary 中呈現。
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.10.1 bandit==1.9.4

      - name: Audit dependencies for known CVEs
        run: |
          pip-audit -r requirements.txt --desc --format markdown \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Static security analysis (bandit)
        run: |
          bandit -r apps IC_alumni utils -ll -f json -o bandit-report.json \
            --exclude '*/migrations/*' || true
          bandit -r apps IC_alumni utils -ll --exclude '*/migrations/*' \
            | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-security-reports
          path: bandit-report.json
          retention-days: 30
          if-no-files-found: ignore
