[pytest]
DJANGO_SETTINGS_MODULE = tests.settings_test
python_files = test_*.py tests.py
python_classes = Test*
python_functions = test_*

# 測試檔散落在 tests/（新的體系）與 apps/（歷史遺留），兩邊都要收。
testpaths = tests apps

addopts =
    --strict-markers
    --strict-config
    -ra
    --durations=10
    --tb=short

# ── 分類標記 ──
# 用法：pytest -m "not slow"、pytest -m contract
markers =
    contract: API 介面／路由清單契約測試，介面異動時會失敗（需人工確認並更新基準檔）
    security: 資安不變式與回歸測試，失敗一律視為 blocker
    performance: 查詢次數／N+1 預算測試
    integration: 需要外部服務（MySQL/Redis）的整合測試，預設 CI 不執行
    slow: 執行時間較長的測試

filterwarnings =
    default
    # drf-yasg 在 setuptools<81 下必然噴這行，與本專案程式碼無關。
    ignore:pkg_resources is deprecated as an API:UserWarning
